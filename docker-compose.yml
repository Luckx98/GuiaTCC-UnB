services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────────
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: guia_orientador_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guia_orientador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg_password}
      POSTGRES_DB: ${POSTGRES_DB:-guia_orientador_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guia_orientador}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migrações versionadas ──────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guia_orientador_migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-guia_orientador}:${POSTGRES_PASSWORD:-changeme_pg_password}@postgres:5432/${POSTGRES_DB:-guia_orientador_db}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
