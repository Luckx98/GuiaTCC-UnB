[project]
name = "leitos-sus-df"
version = "0.1.0"
description = "Plataforma de dados sobre ocupação de leitos SUS no DF: carga do SIH/SUS e do CNES para uma origem OLTP insert-only"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
